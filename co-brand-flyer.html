<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SONYMA Co-Branded Flyer · 8.5×11</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #c8d4e6;
    min-height: 100vh;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 100;
    background: #0a1f3d; color: #fff;
    padding: 12px 16px;
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
  }
  .toolbar-title { font-size: 14px; font-weight: 700; }
  .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .toolbar a, .toolbar button {
    color: #fff; background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.28); border-radius: 8px;
    padding: 9px 14px; text-decoration: none; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600;
  }
  .toolbar button.primary { background: #1a56b0; border-color: #2b6cb0; }
  .page-wrap {
    padding: 20px 12px 40px;
    display: flex; justify-content: center;
  }
  .page {
    width: 8.5in;
    max-width: 100%;
    background: #fff;
    box-shadow: 0 16px 50px rgba(15, 23, 42, 0.22);
    line-height: 0;
  }
  .page img {
    width: 100%;
    height: auto;
    display: block;
  }
  .note {
    max-width: 8.5in;
    margin: 0 auto 24px;
    padding: 0 16px;
    font-size: 13px;
    color: #4a5a75;
    text-align: center;
  }
  @page { size: letter portrait; margin: 0; }
  @media print {
    html, body {
      background: #fff !important;
      margin: 0 !important;
      padding: 0 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .toolbar, .note, .no-print { display: none !important; }
    .page-wrap { padding: 0 !important; margin: 0 !important; }
    .page {
      box-shadow: none !important;
      width: 8.5in !important;
      max-width: none !important;
      margin: 0 !important;
    }
    .page img {
      width: 8.5in !important;
      max-width: 8.5in !important;
      height: 11in !important;
      object-fit: cover;
      object-position: top center;
    }
  }
  @media (max-width: 900px) {
    .page-wrap { padding: 8px 0 32px; }
    .toolbar { padding: 10px 12px; }
    .toolbar-title { font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="toolbar no-print">
    <div class="toolbar-title">SONYMA Co-Branded Flyer · 8.5×11</div>
    <div class="toolbar-actions">
      <button type="button" class="primary" onclick="window.print()">Print / Save PDF</button>
      <a href="/eligible.html">Eligibility Explorer</a>
      <a href="/">Realtor Toolkit</a>
    </div>
  </div>

  <div class="page-wrap">
    <div class="page">
      <img src="https://lh3.googleusercontent.com/d/1qG_LxmhLg78Bmb2ZyurXTBk5hF7NcN9s" alt="SONYMA Co-Branded Flyer">
    </div>
  </div>

  <p class="note no-print">
    Use <strong>Print / Save PDF</strong> for a clean Letter-size flyer.
    Chrome / Safari → Destination: Save as PDF → Paper size: Letter → Margins: None.
  </p>
</body>
</html>
