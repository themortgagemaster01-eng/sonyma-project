<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SONYMA Co-Branded Flyer | Robert A. Castro + Realtor Partner</title>
<style>
  :root {
    --navy: #0a2a5c;
    --navy2: #123a7a;
    --blue: #1a56b0;
    --blue-bright: #2b6cb0;
    --light: #eef4fb;
    --ink: #1a2744;
    --muted: #5a6a85;
    --white: #ffffff;
    --line: #d0dceb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: #dce4f0;
    color: var(--ink);
    line-height: 1.35;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--navy); color: #fff;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    padding: 10px 16px; font-size: 13px;
  }
  .toolbar a, .toolbar button {
    color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28);
    border-radius: 8px; padding: 8px 14px; text-decoration: none; cursor: pointer; font: inherit;
  }
  .toolbar button:hover, .toolbar a:hover { background: rgba(255,255,255,.22); }

  /* PAGE — exact letter size */
  .page {
    width: 8.5in;
    min-height: 11in;
    margin: 20px auto;
    background: #fff;
    box-shadow: 0 14px 48px rgba(15, 23, 42, 0.2);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  
  /* ========== HERO (exact original flyer visual) ========== */
  .hero {
    position: relative;
    height: 3.4in;
    background: #f4f7fb;
    overflow: hidden;
  }
  .hero-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: left center;
  }
  .hero-overlay-robert {
    position: absolute;
    right: 0.08in;
    bottom: 0.15in;
    z-index: 5;
    width: 1.9in;
    height: 1.9in;
  }
  .hero-overlay-robert img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    border-radius: 50%;
    border: 4px solid #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .robert-label {
    position: absolute;
    right: 0.05in;
    bottom: 0.02in;
    z-index: 6;
    background: #0a2a5c;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px 3px;
    border-radius: 3px 0 0 0;
    letter-spacing: 0.02em;
  }

  /* Blue rate banner under hero */
  .rate-banner {
    background: var(--navy);
    color: #fff;
    text-align: center;
    padding: 8px 16px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .rate-banner span {
    opacity: 0.92;
    font-weight: 500;
    margin: 0 6px;
  }

  /* ========== BENEFITS STRIP ========== */
  .benefits {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .benefit {
    padding: 13px 10px;
    text-align: center;
    border-right: 1px solid var(--line);
  }
  .benefit:last-child { border-right: 0; }
  .benefit .ico {
    width: 28px; height: 28px;
    margin: 0 auto 5px;
    display: flex; align-items: center; justify-content: center;
  }
  .benefit .ico svg { width: 24px; height: 24px; }
  .benefit strong {
    display: block;
    font-size: 12.5px;
    color: var(--navy);
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  .benefit span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ========== BODY PANELS ========== */
  .body {
    padding: 14px 20px 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex: 1;
  }
  .panel {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 13px 11px;
    background: #fff;
  }
  .panel.accent {
    background: linear-gradient(160deg, #f0f6ff 0%, #e8f0fa 100%);
    border-color: #b8cfe8;
  }
  .panel h2 {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 8px;
    padding-bottom: 5px;
    border-bottom: 2px solid #c5d6ec;
  }
  .panel ul {
    list-style: none;
  }
  .panel li {
    position: relative;
    padding: 0 0 6px 16px;
    font-size: 12px;
    line-height: 1.32;
    color: var(--ink);
  }
  .panel li::before {
    content: "";
    position: absolute;
    left: 0; top: 5px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--blue);
  }
  .panel .note {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.35;
  }

  /* ========== CTA + QR ========== */
  .cta {
    margin: 0 20px 12px;
    background: linear-gradient(135deg, var(--navy) 0%, #164a9a 100%);
    color: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    align-items: center;
  }
  .cta h3 {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 3px;
  }
  .cta p {
    font-size: 11.5px;
    opacity: 0.93;
    line-height: 1.35;
  }
  .qr-wrap {
    text-align: center;
  }
  .qr-box {
    width: 1.05in;
    height: 1.05in;
    background: #fff;
    border-radius: 8px;
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .qr-cap {
    font-size: 9px;
    margin-top: 3px;
    opacity: 0.9;
  }

  /* ========== TEAM / CO-BRAND ========== */
  .team {
    margin: 0 20px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }
  .team-head {
    grid-column: 1 / -1;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 2px;
  }
  .who strong {
    display: block;
    font-size: 12.5px;
    color: var(--navy);
    font-weight: 800;
  }
  .who span {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.35;
  }
  .who .title {
    font-size: 11px;
    color: var(--blue);
    font-weight: 600;
  }

  /* ========== FOOTER ========== */
  .footer {
    background: var(--navy);
    color: #fff;
    padding: 10px 18px 11px;
    margin-top: auto;
  }
  .footer-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr auto;
    gap: 10px;
    align-items: start;
    font-size: 11px;
  }
  .footer strong { display: block; font-size: 11.5px; margin-bottom: 1px; }
  .footer a { color: rgba(255,255,255,0.92); text-decoration: none; }
  .footer .eho {
    font-size: 10px;
    text-align: right;
    opacity: 0.9;
  }
  .disc {
    margin-top: 7px;
    font-size: 7.8px;
    line-height: 1.32;
    opacity: 0.72;
  }

  .edit-note {
    max-width: 8.5in;
    margin: 8px auto 28px;
    padding: 0 12px;
    font-size: 12px;
    color: #475569;
  }
  .edit-note code {
    background: #e2e8f0;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
  }

  /* PRINT */
  @media print {
    body { background: #fff; }
    .toolbar, .edit-note { display: none !important; }
    .page {
      margin: 0;
      box-shadow: none;
      width: 100%;
      min-height: 11in;
    }
    @page { size: letter; margin: 0; }
  }

  @media (max-width: 900px) {
    .page { width: 100%; margin: 0; box-shadow: none; }
    .hero { height: auto; min-height: 260px; }
    .body, .team, .footer-grid { grid-template-columns: 1fr; }
    .cta { grid-template-columns: 1fr; }
    .robert-curve { width: 1.9in; height: 2.1in; }
    .robert-curve img { width: 1.5in; height: 1.5in; }
  }
</style>
</head>
